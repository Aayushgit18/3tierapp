replicaCount: 1

image:
  repository: mysql
  tag: "8.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3306

persistence:
  enabled: true
  size: 10Gi
  storageClass: managed-csi

keyVault:
  name: <key-vault-name>
  tenantId: <id>

  #  THIS MUST BE KUBELET CLIENT ID
  identityClientId: <id>

  secrets:
    rootPassword: <id>
    database: <id>
