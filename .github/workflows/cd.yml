name: CD - Deploy to AKS

on:
  workflow_run:
    workflows: ["CI - Build Scan Push (ACR)"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm (Umbrella)
        run: |
          helm upgrade --install three-tier-app ./helm/umbrella \
            --namespace default \
            --create-namespace \
            --set springboot.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set angular.image.tag=${{ github.event.workflow_run.head_sha }}
