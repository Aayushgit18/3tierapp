name: CI - Build Scan Push (ACR)

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🔐 OIDC Login (NO SECRET JSON)
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 🔐 Login to ACR using OIDC
      - name: ACR Login
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      # 🔎 Install Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.50.0_Linux-64bit.deb

      # 🏗 Backend Build
      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/spring-crud:$IMAGE_TAG ./SpringCRUD

      - name: Scan Backend Image
        run: |
          trivy image --exit-code 0 --severity HIGH,CRITICAL \
          ${{ secrets.ACR_NAME }}.azurecr.io/spring-crud:$IMAGE_TAG

      - name: Push Backend
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/spring-crud:$IMAGE_TAG

      # 🏗 Frontend Build
      - name: Build Angular Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/angular-crud:$IMAGE_TAG ./AngularCRUD

      - name: Scan Angular Image
        run: |
          trivy image --exit-code 0 --severity HIGH,CRITICAL \
          ${{ secrets.ACR_NAME }}.azurecr.io/angular-crud:$IMAGE_TAG

      - name: Push Angular
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/angular-crud:$IMAGE_TAG
